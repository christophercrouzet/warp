name: Deploy Sphinx documentation to Pages

# Runs on every tag created beginning with the character v
on:
  push:
    tags:
      - v*
    branches:
      - release-*
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.8.23"
      - name: Set up Python
        run: uv python install
      - name: Build Warp without CUDA Support
        run: |
          uv run build_lib.py
      - name: Build Sphinx documentation
        run: |
          uv run --extra docs build_docs.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html/
      - name: Deploy to gh-pages
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            DOCS_VERSION="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              DOCS_VERSION="dev"
            elif [[ "${GITHUB_REF_NAME}" =~ ^release- ]]; then
              raw_version="${GITHUB_REF_NAME#release-}"
              if [[ "${raw_version}" =~ ^v?([0-9]+)\.([0-9]+) ]]; then
                DOCS_VERSION="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              else
                echo "Unsupported release branch name: ${GITHUB_REF_NAME}" >&2
                exit 1
              fi
            else
              echo "Unsupported branch ref: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            echo "Unsupported ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          mkdir -p .docs-deploy
          cp tools/ci/update_docs_versions.py .docs-deploy/update_docs_versions.py
          cp docs/_static/docs-landing.html .docs-deploy/docs-landing.html

          git fetch origin gh-pages || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
            git reset --hard origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          rm -rf "${DOCS_VERSION}"
          mkdir -p "${DOCS_VERSION}"
          cp -a docs/_build/html/. "${DOCS_VERSION}/"

          touch .nojekyll
          cp .docs-deploy/docs-landing.html index.html
          python .docs-deploy/update_docs_versions.py --version "${DOCS_VERSION}" --output versions.json

          LATEST_VERSION="$(python - <<'PY'
import json

try:
    with open("versions.json", "r", encoding="utf-8") as handle:
        data = json.load(handle)
except Exception:
    print("")
else:
    print(data.get("latest") or "")
PY
)"
          if [[ -n "${LATEST_VERSION}" && -d "${LATEST_VERSION}" ]]; then
            rm -rf latest
            mkdir -p latest
            cp -a "${LATEST_VERSION}/." latest/
          fi

          git add "${DOCS_VERSION}" versions.json index.html .nojekyll
          if [[ -d latest ]]; then
            git add latest
          fi
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
          else
            git commit -m "Deploy docs for ${DOCS_VERSION}"
            git push origin gh-pages
          fi
